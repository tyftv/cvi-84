<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVI-84</title>
<meta name="description" content="The 1984 Fairlight Computer Video Instrument, rebuilt for the browser with a modern editor layout. Load any video, perform live, record automation, export MP4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: editor workspace. Effects browser left, viewer + tools + transport centre, inspector right, automation timeline bottom.
   Single dark theme, like every video editor. */
:root {
  color-scheme: dark;
  --bg: #111215;
  --panel: #18191d;
  --raised: #202227;
  --hover: #2a2c33;
  --line: #2c2e35;
  --text: #e8e8ec;
  --dim: #9b9da7;
  --faint: #6c6e78;
  --accent: #4f7bff;          /* CVI menu blue, brightened for a dark UI */
  --accent-soft: #4f7bff26;
  --auto: #ffb02e;            /* automation lanes / keyframes */
  --rec: #ff453a;
  --ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

.ws { height: 100%; display: grid; grid-template-columns: 370px minmax(0, 1fr) 280px; grid-template-rows: 48px minmax(0, 1fr) auto; grid-template-areas: "top top top" "insp view fx" "tl tl tl"; }
@media (max-width: 1100px) { .ws { grid-template-columns: 330px minmax(0, 1fr) 230px; } }
@media (max-width: 860px) {
  body { overflow: auto; }
  .ws { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "view" "insp" "fx" "tl"; }
  .fx, .insp { max-height: none !important; border: 0 !important; border-top: 1px solid var(--line) !important; }
}

/* ---------- top bar ---------- */
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; font-size: 15px; margin-right: 10px; white-space: nowrap; }
.logo i { width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(90deg, #ff3b30 0 16%, #ffcc00 16% 33%, #34c759 33% 50%, #00c7be 50% 66%, #4f7bff 66% 83%, #af52de 83%); display: inline-block; }
.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: none; border-color: transparent; color: var(--dim); }
.btn.ghost:hover { color: var(--text); background: var(--raised); }
button svg, button svg * { pointer-events: none; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.srcname { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.spacer { flex: 1; }
@media (max-width: 860px) { .top { flex-wrap: wrap; height: auto; padding-block: 8px; } .srcname { flex-basis: 100%; order: 9; } }

/* ---------- panels ---------- */
.panel-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
.fx { grid-area: fx; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { margin: 0 12px 8px; height: 30px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); padding: 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 8px; }
.chip { height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--dim); cursor: pointer; font-size: 12px; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.fxlist { flex: 1; overflow: auto; padding: 0 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; min-height: 0; }
@media (max-width: 860px) { .fxlist { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); max-height: 420px; } }
.card { border: 1px solid transparent; border-radius: var(--r); background: none; padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
.card canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 4px; background: #000; display: block; }
.card span { font-size: 12px; line-height: 1.25; padding: 0 2px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card b { color: var(--faint); font: 500 11px var(--mono); margin-right: 4px; }
.card:hover span { color: var(--text); }
.card.on { border-color: var(--accent); }
.card.on span { color: var(--text); }
.mine-row { display: flex; gap: 6px; padding: 0 12px 10px; }
.mine-row input { flex: 1; min-width: 0; height: 28px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); padding: 0 8px; }

/* ---------- viewer ---------- */
.view { grid-area: view; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.tools { display: flex; align-items: center; gap: 2px; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tool { width: 32px; height: 30px; flex: none; border-radius: var(--r); border: 0; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; }
.tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--raised); color: var(--text); }
.tool.on { background: var(--accent-soft); color: var(--accent); }
.tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; flex: none; }
.target { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--r); flex: none; }
.target button { height: 24px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; font-size: 12px; }
.target button.on { background: var(--raised); color: var(--text); }
.toolhint { color: var(--faint); font-size: 12px; margin-left: 8px; white-space: nowrap; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px; position: relative; overflow: hidden; }
@media (max-width: 860px) { .stage { min-height: 56vw; } }
.screen { position: relative; background: #000; width: 640px; height: 480px; border-radius: 4px; overflow: hidden; touch-action: none; box-shadow: 0 0 0 1px #000, 0 10px 40px #0008; }

.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { pointer-events: none; }
.screen.painting { cursor: crosshair; }
.drop { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.drop div { background: #000a; border: 1px dashed #fff8; border-radius: 8px; padding: 14px 20px; text-align: center; color: #fff; font-weight: 500; }
.drop small { display: block; color: #fffa; font-weight: 400; margin-top: 2px; }
.screen.dragging .drop div { border-color: var(--accent); background: #0b1640cc; }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: #000c; color: #fff; text-align: center; padding: 20px; }
.busy .pbar { width: min(320px, 70vw); margin: 10px auto 0; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000d; border: 1px solid var(--line); color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 12px; pointer-events: none; transition: opacity .2s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.transport { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tbtn { width: 34px; height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); cursor: pointer; display: grid; place-items: center; color: var(--text); }
.tbtn:hover { background: var(--hover); }
.tbtn svg { width: 15px; height: 15px; fill: currentColor; }
.tbtn.on { border-color: var(--accent); color: var(--accent); }
.recbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 600; }
.recbtn i { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
.recbtn.on { background: #4a1512; border-color: var(--rec); }
.recbtn.on.live i { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.freezebtn { height: 32px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 600; }
.freezebtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tc { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; color: var(--text); min-width: 100px; margin-left: 4px; }
.tc small { color: var(--faint); font-size: 12px; }

/* ---------- inspector ---------- */
.insp { grid-area: insp; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; min-height: 0; }
.sec { border-bottom: 1px solid var(--line); }
.sec > header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; }
.sec > header h3 { margin: 0; flex: 1; font-size: 13px; font-weight: 600; }
.sec > header .chev { width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; transition: transform .15s; }
.sec.closed > header .chev { transform: rotate(-90deg); }
.sec.closed > .body { display: none; }
.sec > .body { padding: 2px 12px 14px; display: grid; gap: 10px; }
.sub { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
.desc { color: var(--dim); font-size: 12px; margin: -4px 0 0; }
.switch { width: 32px; height: 18px; flex: none; border-radius: 9px; border: 0; background: #3a3c44; position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #c9cad1; transition: left .12s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 16px; background: #fff; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row > label { flex: 1; min-width: 0; }
.field { display: grid; grid-template-columns: 88px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.field > span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.field > span.dot::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--auto); margin-left: 5px; vertical-align: middle; }
.field output { font: 12px var(--mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.field select, .field input[type=color] { grid-column: 2 / 4; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: none; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--track, #3a3c44); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track, #3a3c44); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -5px; box-shadow: 0 1px 3px #0009; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0009; }
select { height: 28px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); padding: 0 6px; min-width: 0; width: 100%; }
input[type=color] { height: 28px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); padding: 2px; cursor: pointer; width: 100%; }
textarea { width: 100%; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); padding: 6px 8px; resize: vertical; }
.seg { display: flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.seg button { flex: 1; height: 26px; border: 0; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; font-size: 12px; white-space: nowrap; padding: 0 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px #0006; }
.grid-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gbtn { height: 30px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 12px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbtn:hover { background: var(--hover); }
.gbtn.on { border-color: var(--accent); color: var(--accent); }
.gbtn.stop { color: #ff8a80; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.swatches button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 4px; padding: 0; background: #000; cursor: pointer; overflow: hidden; }
.swatches button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.swatches img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.brushes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.brushes button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--text); }
.brushes button.on { border-color: var(--accent); background: var(--accent-soft); }
.brushes canvas { width: 70%; height: 70%; image-rendering: pixelated; }
.paintcol { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: center; }
.paintcol .chipcol { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); }
.hue { --track: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.bip { --track: linear-gradient(90deg, #3a3c44 0 49.5%, var(--faint) 49.5% 50.5%, #3a3c44 50.5%); }

/* ---------- tabs, library, chain ---------- */
.tabs { display: flex; gap: 2px; padding: 8px 12px 8px; }
.tab { flex: 1; height: 30px; border: 1px solid var(--line); background: none; color: var(--dim); border-radius: var(--r); cursor: pointer; font-weight: 600; }
.tab.on { background: var(--raised); color: var(--text); border-color: #3a3c44; }
.tabs.small { padding: 0; flex: none; }
.tabs.small .tab { flex: none; padding: 0 12px; height: 28px; font-size: 12px; }
.libpane { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.libpane > .fxlist { flex: 1; overflow: visible; }
.libcat { padding: 4px 12px 2px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.libgrid { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 0 8px 10px; }
.mod { display: grid; grid-template-columns: 56px minmax(0, 1fr) 22px; gap: 10px; align-items: center; padding: 5px; border-radius: var(--r); border: 1px solid transparent; background: none; cursor: pointer; text-align: left; }
.mod:hover { background: var(--raised); border-color: var(--line); }
.mod canvas, .mod .tile { width: 56px; height: 42px; border-radius: 4px; background: #000; display: block; }
.mod b { display: block; font-weight: 600; font-size: 13px; }
.mod small { display: block; color: var(--faint); font-size: 11.5px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mod .plus { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); border: 1px solid var(--line); font-size: 15px; line-height: 1; }
.mod:hover .plus { background: var(--accent); border-color: var(--accent); color: #fff; }
.tile.bw { background: linear-gradient(135deg, #111, #eee); }
.tile.halftone { background: radial-gradient(circle, #222 35%, transparent 37%) 0 0 / 8px 8px, #f2efe6; }
.tile.vhs { background: repeating-linear-gradient(0deg, #0000 0 3px, #fff2 3px 4px), linear-gradient(90deg, #c33, #3c3 40%, #33c); }
.tile.crt { background: repeating-linear-gradient(90deg, #f33 0 1px, #3f3 1px 2px, #33f 2px 3px), #111; border-radius: 10px !important; }
.prehint { padding: 0 12px 6px; margin: 0; }
.chainpane { overflow-x: auto; padding: 4px 0 2px; }
.strip { display: flex; align-items: stretch; gap: 0; min-height: 76px; }
.pill { flex: none; display: grid; place-items: center; padding: 0 14px; border-radius: var(--r); border: 1px dashed var(--line); color: var(--dim); font-weight: 600; font-size: 12px; background: none; cursor: pointer; }
.pill:hover { color: var(--text); }
.pill.on { border-style: solid; border-color: var(--accent); color: var(--text); }
.arrow { flex: none; width: 22px; display: grid; place-items: center; color: var(--faint); }
.arrow svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.block { flex: none; width: 150px; border-radius: var(--r); border: 1px solid var(--line); background: var(--raised); padding: 8px 8px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; user-select: none; }
.block:hover { border-color: #44474f; }
.block.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.block.off { opacity: .45; }
.block.dragging { opacity: .3; }
.block.drop-l::before, .block.drop-r::after { content: ""; position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--accent); border-radius: 2px; }
.block.drop-l::before { left: -14px; } .block.drop-r::after { right: -14px; }
.block .bn { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 40px; }
.block .bc { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.block .bc i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.block .bt { position: absolute; top: 5px; right: 5px; display: flex; gap: 2px; }
.block .bt button { width: 20px; height: 20px; border: 0; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; padding: 0; }
.block .bt button:hover { background: var(--hover); color: var(--text); }
.block .bt svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.block .bm { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.block .bm i { display: block; height: 100%; background: var(--accent); }
.addblock { flex: none; width: 120px; border-radius: var(--r); border: 1px dashed var(--line); background: none; color: var(--dim); cursor: pointer; font-weight: 600; }
.addblock:hover { color: var(--text); border-color: var(--accent); }
.insp-head { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.insp-head input.name { font-weight: 600; font-size: 15px; background: none; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; margin-left: -5px; width: 100%; }
.insp-head input.name:hover, .insp-head input.name:focus { border-color: var(--line); background: var(--bg); }
.insp-head .desc { margin: 0; }
.empty { padding: 20px 14px; color: var(--dim); }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 14px; }

/* ---------- chain stack (left) ---------- */
.ch-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.ch-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); flex: 1; }
.ch-src, .ch-out { margin: 8px 10px; border: 1px dashed var(--line); border-radius: var(--r); }
.ch-src { padding: 9px 12px; display: flex; align-items: center; gap: 8px; color: var(--dim); cursor: pointer; background: none; width: calc(100% - 20px); text-align: left; }
.ch-src:hover { color: var(--text); border-color: #44474f; }
.ch-src b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-flow { display: grid; place-items: center; height: 14px; color: var(--faint); }
.ch-flow svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.ccard { margin: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); position: relative; }
.ccard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ccard.off > .chead .cname { opacity: .45; text-decoration: line-through; }
.ccard.drop-t::before, .ccard.drop-b::after { content: ""; position: absolute; left: -2px; right: -2px; height: 3px; background: var(--accent); border-radius: 2px; }
.ccard.drop-t::before { top: -10px; } .ccard.drop-b::after { bottom: -10px; }
.ccard.dragging { opacity: .35; }
.chead { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 4px; cursor: pointer; user-select: none; }
.chead .grip { width: 18px; height: 24px; display: grid; place-items: center; color: var(--faint); cursor: grab; flex: none; }
.chead .grip svg { width: 12px; height: 16px; fill: currentColor; }
.chead .chev2 { width: 14px; height: 14px; stroke: var(--dim); fill: none; stroke-width: 2; transition: transform .15s; flex: none; }
.ccard.closed .chev2 { transform: rotate(-90deg); }
.chead .num { font: 500 11px var(--mono); color: var(--faint); width: 16px; text-align: right; flex: none; }
.chead .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chead .cname { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chead .ib { width: 26px; height: 26px; border: 0; border-radius: 5px; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
.chead .ib:hover { background: var(--raised); color: var(--text); }
.chead .ib svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.chead .ib.pw.on { color: var(--accent); }
.cbody { border-top: 1px solid var(--line); background: var(--panel); border-radius: 0 0 var(--r) var(--r); }
.ccard.closed .cbody { display: none; }
.cbody .cdesc { margin: 0; padding: 10px 12px 0; color: var(--dim); font-size: 12px; }
.cbody .ctop { display: grid; gap: 8px; padding: 10px 12px; }
.cbody .sec:last-child { border-bottom: 0; }
.cbody .sec > header { padding: 8px 12px; }
.cbody .sec > header h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.advbtn { display: block; width: calc(100% - 24px); margin: 4px 12px 12px; height: 30px; border-radius: var(--r); border: 1px dashed var(--line); background: none; color: var(--dim); cursor: pointer; font-size: 12px; }
.advbtn:hover { color: var(--text); border-color: #44474f; }
.ch-empty { margin: 14px 10px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--dim); text-align: center; }
.ch-empty b { display: block; color: var(--text); margin-bottom: 4px; }

/* ---------- timeline ---------- */
.tl { grid-area: tl; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 12px 10px; min-width: 0; }
.tl-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; }
.tl-h h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
.tl-h .sm { height: 26px; padding: 0 9px; font-size: 12px; border-color: var(--line); }
.tl-h .zoom { display: inline-flex; gap: 2px; }
.tl-h .auto-c { color: var(--dim); font-size: 12px; }
.tl-h p { margin: 0; color: var(--faint); font-size: 12px; flex: 1; min-width: 200px; }
#timeline { width: 100%; height: 160px; display: block; border-radius: 4px; background: #0e0f11; border: 1px solid var(--line); cursor: pointer; touch-action: none; }

/* ---------- dialogs ---------- */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: #000b; }
dialog h2 { margin: 0 0 14px; font-size: 17px; }
dialog .field { grid-template-columns: 96px 1fr; margin-bottom: 10px; }
dialog .field select { grid-column: 2; }
.pbar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 14px 0 8px; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
#exportMsg { color: var(--dim); min-height: 1.4em; }
#exportMsg a { color: var(--accent); font-weight: 600; }
.err { color: #ff8a80 !important; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="ws">
  <header class="top">
    <div class="logo"><i></i>CVI-84</div>
    <button class="btn" id="btnImport" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Import clips</button>
    <button class="btn ghost" id="btnImportV2" type="button" title="Adds a clip to the Video 2 track, underneath: it shows through wherever Video 1 is keyed out (Chroma key, Trail, Wipe, double exposure)">+ Video 2 clip</button>
    <input id="fileV1" type="file" hidden><input id="fileV2" type="file" hidden><input id="fileProj" type="file" accept=".json,application/json" hidden>
    <span class="srcname" id="srcName">No video loaded</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="btnOpen" type="button">Open project</button>
    <button class="btn ghost" id="btnSave" type="button">Save project</button>
    <a class="btn ghost" href="manual.html" target="_blank" rel="noopener">Manual</a>
    <a class="btn ghost" href="classic.html" title="The original 1984 console layout">Classic console</a>
    <button class="btn primary" id="btnExport" type="button"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 14v6h16v-6"/></svg>Export MP4</button>
  </header>

  <aside class="fx" aria-label="Effects library">
    <div class="tabs" role="tablist"><button type="button" class="tab on" data-tab="lib" role="tab">Effects</button><button type="button" class="tab" data-tab="pre" role="tab">Presets</button></div>
    <input class="search" id="fxSearch" type="search" placeholder="Search effects" aria-label="Search">
    <div id="libPane" class="libpane"></div>
    <div id="prePane" class="libpane" hidden>
      <div class="chips" id="fxChips"></div>
      <div class="mine-row" id="mineRow" hidden><input id="mineName" type="text" placeholder="Name this chain" maxlength="40"><button class="btn" id="mineSave" type="button">Save chain</button></div>
      <p class="desc prehint" id="preHint"></p>
      <div class="fxlist" id="fxList"></div>
    </div>
  </aside>

  <main class="view">
    <div class="tools" id="tools"></div>
    <div class="stage">
      <div class="screen" id="screen">
        <canvas id="out"></canvas>
        <canvas id="overlay"></canvas>
        <div class="drop" id="drop"><div>Drop videos here<small>Any format: MP4, MOV, AVI, MKV, WMV, MPEG…</small></div></div>
        <div class="busy" id="busy" hidden><div><div id="busyMsg">Converting…</div><div class="pbar"><i id="busyBar"></i></div></div></div>
        <div class="toast" id="toast" style="opacity:0"></div>
      </div>
    </div>
    <div class="transport">
      <button class="tbtn" id="btnHome" type="button" title="Back to start (Home)"><svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
      <button class="tbtn" id="btnPlay" type="button" title="Play / pause (Space)"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button class="tbtn" id="btnLoop" type="button" title="Loop"><svg viewBox="0 0 16 16"><path d="M4 5h7V3l3 3-3 3V7H4v3H2V7a2 2 0 012-2zm8 6H5v2l-3-3 3-3v2h7V6h2v3a2 2 0 01-2 2z"/></svg></button>
      <span class="tc" id="tc">0:00.00</span>
      <span class="spacer"></span>
      <button class="freezebtn" id="btnFreeze" type="button" title="Freeze (F)">Freeze</button>
      <button class="recbtn" id="btnRec" type="button" title="Record automation (R)"><i></i>Record</button>
    </div>
  </main>

  <aside class="insp" id="insp" aria-label="Inspector"></aside>

  <section class="tl" aria-label="Timeline">
    <div class="tl-h"><h3>Timeline</h3>
      <button class="btn ghost sm" id="btnSplit" type="button" title="Cut the clip under the playhead in two (S)">Split</button>
      <button class="btn ghost sm" id="btnDelClip" type="button" title="Remove the selected clip (Delete)">Delete clip</button>
      <span class="zoom"><button class="btn ghost sm" id="btnZoomOut" type="button" title="Zoom out">−</button><button class="btn ghost sm" id="btnZoomFit" type="button" title="Show the whole timeline">Fit</button><button class="btn ghost sm" id="btnZoomIn" type="button" title="Zoom in">+</button></span>
      <p id="tlNote"></p>
      <span class="auto-c">Automation <span id="autoCount"></span></span>
      <button class="btn ghost sm" id="btnClearAuto" type="button">Clear automation</button></div>
    <canvas id="timeline"></canvas>
  </section>
</div>

<dialog id="exportDlg">
  <h2>Export MP4</h2>
  <div class="field"><label for="exRes">Resolution</label><select id="exRes"><option value="src">Same as source</option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option></select></div>
  <div class="field"><label for="exQ">Quality</label><select id="exQ"><option value="high" selected>High</option><option value="vhigh">Very high</option><option value="med">Medium (smaller file)</option></select></div>
  <div class="field"><label for="exAudio">Audio</label><select id="exAudio"><option value="1" selected>Keep original audio</option><option value="0">No audio</option></select></div>
  <div class="pbar"><i id="exBar"></i></div>
  <div id="exportMsg"></div>
  <div class="dlg-actions"><button class="btn" id="exCancel" type="button">Close</button><button class="btn primary" id="exGo" type="button">Render</button></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
